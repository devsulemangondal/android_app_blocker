name: android_app_blocker
description: >-
  Block any Android app from Flutter. Shows a customisable full-screen block
  screen over blocked apps, with permission helpers, on-device usage stats and
  an optional background callback that decides when blocking applies.
version: 0.1.0

repository: https://github.com/devsulemangondal/android_app_blocker
issue_tracker: https://github.com/devsulemangondal/android_app_blocker/issues

topics:
  - android
  - productivity

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.appblocker.android_app_blocker
        pluginClass: AndroidAppBlockerPlugin
